[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webmark"
version = "0.2.0"
description = "WorkBuddy-first configurable URL collection skill"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
fallback = [
  "beautifulsoup4>=4.12,<5",
  "trafilatura>=1.8,<3",
]
test = ["pytest>=8,<9"]

[project.scripts]
webmark = "webmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
